version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: reachinbox-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reachinbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reachinbox_prod_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-reachinbox_scheduler}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U reachinbox -d reachinbox_scheduler']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: reachinbox-redis-prod
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reachinbox-backend-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-reachinbox}:${POSTGRES_PASSWORD:-reachinbox_prod_secure_pass}@postgres:5432/${POSTGRES_DB:-reachinbox_scheduler}
      REDIS_URL: redis://redis:6379
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      ETHEREAL_HOST: ${ETHEREAL_HOST:-smtp.ethereal.email}
      ETHEREAL_PORT: ${ETHEREAL_PORT:-587}
      ETHEREAL_USER: ${ETHEREAL_USER}
      ETHEREAL_PASSWORD: ${ETHEREAL_PASSWORD}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      FRONTEND_URL: ${FRONTEND_URL}
    ports:
      - '3001:3001'

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reachinbox-worker-prod
    restart: always
    command: ["node", "dist/workers/email.worker.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-reachinbox}:${POSTGRES_PASSWORD:-reachinbox_prod_secure_pass}@postgres:5432/${POSTGRES_DB:-reachinbox_scheduler}
      REDIS_URL: redis://redis:6379
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      ETHEREAL_HOST: ${ETHEREAL_HOST:-smtp.ethereal.email}
      ETHEREAL_PORT: ${ETHEREAL_PORT:-587}
      ETHEREAL_USER: ${ETHEREAL_USER}
      ETHEREAL_PASSWORD: ${ETHEREAL_PASSWORD}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reachinbox-frontend-prod
    restart: always
    ports:
      - '80:80'

volumes:
  postgres_data:
  redis_data:
