version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: reachinbox-postgres
    environment:
      POSTGRES_USER: reachinbox
      POSTGRES_PASSWORD: reachinbox_dev
      POSTGRES_DB: reachinbox_scheduler
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U reachinbox -d reachinbox_scheduler']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: reachinbox-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --appendfsync everysec
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reachinbox-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://reachinbox:reachinbox_dev@postgres:5432/reachinbox_scheduler
      REDIS_URL: redis://redis:6379
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-dummy_client_id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-dummy_client_secret}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3001/api/auth/google/callback}
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-in-production-min16chars}
      ETHEREAL_HOST: ${ETHEREAL_HOST:-smtp.ethereal.email}
      ETHEREAL_PORT: ${ETHEREAL_PORT:-587}
      ETHEREAL_USER: ${ETHEREAL_USER:-ethereal_user@ethereal.email}
      ETHEREAL_PASSWORD: ${ETHEREAL_PASSWORD:-ethereal_password}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      FRONTEND_URL: http://localhost:5173
    ports:
      - '3001:3001'
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reachinbox-worker
    command: ["node", "dist/workers/email.worker.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://reachinbox:reachinbox_dev@postgres:5432/reachinbox_scheduler
      REDIS_URL: redis://redis:6379
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      ETHEREAL_HOST: ${ETHEREAL_HOST:-smtp.ethereal.email}
      ETHEREAL_PORT: ${ETHEREAL_PORT:-587}
      ETHEREAL_USER: ${ETHEREAL_USER:-ethereal_user@ethereal.email}
      ETHEREAL_PASSWORD: ${ETHEREAL_PASSWORD:-ethereal_password}
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-in-production-min16chars}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-dummy_client_id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-dummy_client_secret}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reachinbox-frontend
    depends_on:
      - backend
    ports:
      - '5173:80'
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
